packages:
  - packages/*

allowBuilds:
  "@vscode/vsce-sign": false
  dprint: true
  keytar: false

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Consumed jeremybanka packages are exempt at every version.
  # Keep aligned with the npm rule in renovate.json.
  - "@atom.io/eslint-plugin"
  - atom.io
  - "@breakage/changesets"
  - breakage
  - comline
  - correctly
  - takua
  - treetrunks
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"

verifyDepsBeforeRun: error

# cspell:ignore astrojs emnapi
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      # Its WASM runtime needs the same major as its pinned @emnapi/core.
      "@emnapi/runtime": "1.11.3"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0 || 7.1.0-beta
    vite: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
