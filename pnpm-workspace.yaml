packages:
  - packages/*

allowBuilds:
  "@vscode/vsce-sign": false
  dprint: true
  keytar: false

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "correctly"
  - typescript@7.1.0-beta
  - "@typescript/*"
  - agents.yaml
  - atom.io
  - break-check
  - breakage
  - comline
  - takua
  - treetrunks
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
verifyDepsBeforeRun: error

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0 || 7.1.0-beta
    vite: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
