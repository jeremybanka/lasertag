packages:
  - packages/*

allowBuilds:
  "@vscode/vsce-sign": false
  dprint: true
  keytar: false

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - takua@0.2.2
verifyDepsBeforeRun: error

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
