packages:
  - packages/*

allowBuilds:
  "@vscode/vsce-sign": false
  dprint: true
  keytar: false

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - agents.yaml
  - atom.io
  - comline
  - takua
  - treetrunks
verifyDepsBeforeRun: error

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
    vite: "*"
    vitest: "*"
