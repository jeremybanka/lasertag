name: Setup
description: Download and install 3rd party software.
runs:
  using: composite
  steps:
    - name: Install Mise
      uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      with:
        version: 2026.6.7

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
