name: Setup
description: Download and install 3rd party software.
runs:
  using: composite
  steps:
    - name: Install Mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.8.14

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
